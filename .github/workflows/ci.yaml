name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Evaluates every output for Linux without building the systems, which is left to the machines themselves, and runs
  # the formatting, lints and commit hooks.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the current system
        run: echo "SYSTEM=$(nix eval --impure --raw --expr builtins.currentSystem)" >> "$GITHUB_ENV"
      # Some modules read files from derivations while evaluating, which `--no-build` refuses to build, so every check is
      # instantiated first.
      - name: Instantiate the checks
        run: |
          nix eval --json ".#checks.$SYSTEM" --apply 'builtins.mapAttrs (_: check: check.drvPath)'
      - name: Evaluate the flake
        run: nix flake check --no-build
      - name: Check formatting, lints and commit hooks
        run: nix build --print-build-logs ".#checks.$SYSTEM.git-hooks"

  # Only what needs macOS: the checks Linux does not have, such as the nix-darwin hosts, whose evaluation builds files
  # that only macOS can build.
  check-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the current system
        run: echo "SYSTEM=$(nix eval --impure --raw --expr builtins.currentSystem)" >> "$GITHUB_ENV"
      - name: Evaluate the checks only macOS has
        run: |
          nix eval --json ".#checks" --apply "checks: builtins.mapAttrs (_: check: check.drvPath)
            (removeAttrs checks.$SYSTEM (builtins.attrNames checks.x86_64-linux))"

  # Each push to main is a release, tagged with the date it was merged on, in the merger's timezone, with a `.N` suffix
  # when the day already has one. Tagged before the site is built so the changelog shows it.
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the release
        run: |
          if git tag --points-at HEAD | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "Already tagged."
            exit 0
          fi
          date=$(git log -1 --format=%cd --date=format:%Y.%m.%d)
          tag=$date
          n=0
          while git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do
            n=$((n + 1))
            tag=$date.$n
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Version $tag"
          git push origin "refs/tags/$tag"

  # Built on every run so a broken site fails the pull request, but published only from main.
  docs:
    needs: tag
    # On pull requests the tag job is skipped, which would otherwise skip this one too.
    if: "!cancelled() && needs.tag.result != 'failure'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Module history and the changelog are read from git.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the documentation site
        run: nix run .#dotfiles-docs -- build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.event_name == 'push'
    needs: [check, check-darwin, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and one in flight is left to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
